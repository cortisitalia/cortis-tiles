<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Cortis Beat Drop</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0a0a0f;
            --neon-pink: #ff007f;
            --neon-cyan: #00f3ff;
            --neon-purple: #b026ff;
            --neon-gold: #fbbf24;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            touch-action: none;
        }

        body {
            background-color: var(--bg-main);
            color: #fff;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100dvh;
            width: 100vw;
        }

        .brand-font {
            font-family: 'Orbitron', sans-serif;
        }

        #game-container {
            position: relative;
            width: 100%;
            max-width: 600px;
            height: 100dvh;
            background: linear-gradient(180deg, #111 0%, #000 100%);
            box-shadow: 0 0 50px rgba(176, 38, 255, 0.2);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        canvas {
            display: block;
            width: 100%;
            flex-grow: 1;
        }

        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            z-index: 2;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .score-box {
            background: rgba(20, 20, 31, 0.8);
            border: 1px solid rgba(0, 243, 255, 0.3);
            padding: 8px 16px;
            border-radius: 8px;
            backdrop-filter: blur(4px);
        }

        .score-label {
            font-size: 0.7rem;
            color: var(--neon-cyan);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .score-value {
            font-size: 1.6rem;
            font-weight: 900;
            text-shadow: 0 0 10px var(--neon-cyan);
        }

        .combo-box {
            text-align: right;
        }

        .combo-value {
            font-size: 2.2rem;
            font-weight: 900;
            color: var(--neon-pink);
            text-shadow: 0 0 15px var(--neon-pink);
            line-height: 1;
        }
        
        .combo-label {
            font-size: 0.8rem;
            color: #fff;
            letter-spacing: 2px;
        }

        .overlay-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 10, 15, 0.96);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: all;
            z-index: 10;
            transition: opacity 0.3s;
            padding: 20px;
            overflow-y: auto;
        }

        .hidden {
            opacity: 0;
            pointer-events: none;
        }

        h1 {
            font-size: 3rem;
            text-align: center;
            margin-bottom: 5px;
            background: linear-gradient(to right, var(--neon-pink), var(--neon-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(176, 38, 255, 0.5);
        }

        .subtitle {
            font-size: 1rem;
            color: var(--neon-purple);
            letter-spacing: 4px;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .song-selector {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
            max-width: 320px;
            margin-bottom: 20px;
        }

        .song-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #aaa;
            padding: 10px;
            border-radius: 8px;
            font-family: 'Orbitron';
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .song-btn.active {
            border-color: var(--neon-cyan);
            color: #fff;
            background: rgba(0, 243, 255, 0.1);
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.2);
        }

        .diff-selector {
            display: flex;
            gap: 8px;
            margin-bottom: 25px;
            width: 100%;
            max-width: 320px;
        }

        .diff-btn {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #aaa;
            padding: 8px;
            border-radius: 6px;
            font-family: 'Orbitron';
            font-size: 0.75rem;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
        }

        .diff-btn.active {
            border-color: var(--neon-pink);
            color: #fff;
            background: rgba(255, 0, 127, 0.15);
            box-shadow: 0 0 10px rgba(255, 0, 127, 0.3);
        }

        .start-btn {
            background: transparent;
            color: #fff;
            border: 2px solid var(--neon-cyan);
            padding: 12px 35px;
            font-size: 1.2rem;
            text-transform: uppercase;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.3), inset 0 0 15px rgba(0, 243, 255, 0.1);
        }

        .start-btn:hover {
            background: var(--neon-cyan);
            color: #000;
            box-shadow: 0 0 30px var(--neon-cyan);
            transform: scale(1.05);
        }

        .mobile-controls {
            position: absolute;
            bottom: 10px;
            left: 10px;
            right: 10px;
            height: 110px;
            display: flex;
            gap: 8px;
            pointer-events: all;
            z-index: 5;
        }
        
        .lane-btn {
            flex: 1;
            height: 100%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 12px;
            font-family: 'Orbitron';
            font-weight: bold;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.4);
            transition: background 0.1s, border-color 0.1s;
        }
        
        .lane-btn:active, .lane-btn.touched {
            background: rgba(255, 255, 255, 0.2);
            border-color: #fff;
            color: #fff;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>

        <div class="mobile-controls" id="touch-controls"></div>

        <div class="ui-layer">
            <div class="top-bar">
                <div class="score-box brand-font">
                    <div class="score-label">Score</div>
                    <div class="score-value" id="score">0</div>
                </div>
                <div class="combo-box brand-font">
                    <div class="combo-value" id="combo">0</div>
                    <div class="combo-label">COMBO</div>
                </div>
            </div>
        </div>

        <div class="overlay-screen" id="start-screen">
            <h1 class="brand-font">CORTIS</h1>
            <div class="subtitle">Beat Drop</div>
            
            <div style="font-size: 0.8rem; color: #aaa; margin-bottom: 8px; font-family: 'Orbitron'; text-transform: uppercase;">Seleziona Canzone</div>
            <div class="song-selector" id="song-selector"></div>

            <div style="font-size: 0.8rem; color: #aaa; margin-bottom: 8px; font-family: 'Orbitron'; text-transform: uppercase;">Difficoltà</div>
            <div class="diff-selector" id="diff-selector">
                <div class="diff-btn" data-diff="easy">Facile (2L)</div>
                <div class="diff-btn active" data-diff="normal">Normale (3L)</div>
                <div class="diff-btn" data-diff="hard">Difficile (4L)</div>
            </div>

            <button class="start-btn brand-font" id="start-btn">Inizia Show</button>
        </div>
    </div>

    <!-- Elemento Audio Standard compatibile al 100% con iPhone -->
    <audio id="bgAudio" preload="auto"></audio>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const startScreen = document.getElementById('start-screen');
        const startBtn = document.getElementById('start-btn');
        const scoreEl = document.getElementById('score');
        const comboEl = document.getElementById('combo');
        const touchControlsContainer = document.getElementById('touch-controls');
        const audioElement = document.getElementById('bgAudio');

        const SONGS = [
            { id: 'money', title: 'MONEYMONEYMONEY', url: 'audio/MONEYMONEYMONEY.mp3' },
            { id: 'go', title: 'GO!', url: 'audio/go.mp3' }
        ];
        let currentSongUrl = SONGS[0].url;

        const DIFFICULTIES = {
            easy: { lanes: 2, interval: 700 },
            normal: { lanes: 3, interval: 500 },
            hard: { lanes: 4, interval: 380 }
        };
        let currentDiff = 'normal';

        const COLORS = ['#ff007f', '#00f3ff', '#b026ff', '#fbbf24'];
        const ACTIVE_KEYS = ['a', 's', 'd', 'f'];

        let numLanes = 3;
        let laneWidth = 0;
        let hitZoneY = 0;
        const noteHeight = 22;
        let fallTimeSeconds = 1.2;
        let noteSpeed = 0;

        let isPlaying = false;
        let score = 0;
        let combo = 0;
        let notes = [];
        let particles = [];
        let floatingTexts = [];
        
        let spawnTimer = 0;
        let spawnInterval = 500;

        function updateDifficultySettings() {
            const config = DIFFICULTIES[currentDiff];
            numLanes = config.lanes;
            spawnInterval = config.interval;
            buildTouchControls();
            resize();
        }

        function buildSongList() {
            const container = document.getElementById('song-selector');
            container.innerHTML = '';
            SONGS.forEach((song, index) => {
                const btn = document.createElement('div');
                btn.className = 'song-btn';
                if(index === 0) btn.classList.add('active');
                btn.innerText = song.title;
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.song-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentSongUrl = song.url;
                });
                container.appendChild(btn);
            });
        }

        function buildTouchControls() {
            touchControlsContainer.innerHTML = '';
            for(let i = 0; i < numLanes; i++) {
                const btn = document.createElement('div');
                btn.className = 'lane-btn';
                btn.innerText = ACTIVE_KEYS[i].toUpperCase();
                
                const trigger = (e) => {
                    e.preventDefault();
                    if (!isPlaying) return;
                    btn.classList.add('touched');
                    setTimeout(() => btn.classList.remove('touched'), 100);
                    handleInput(i);
                };
                
                btn.addEventListener('touchstart', trigger, {passive: false});
                btn.addEventListener('mousedown', trigger);
                touchControlsContainer.appendChild(btn);
            }
        }

        function resize() {
            const container = document.getElementById('game-container');
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight - 130; 
            laneWidth = canvas.width / numLanes;
            hitZoneY = canvas.height - 35;
            noteSpeed = (hitZoneY + noteHeight) / fallTimeSeconds;
        }
        window.addEventListener('resize', resize);

        class Note {
            constructor(lane) {
                this.lane = lane;
                this.x = lane * laneWidth;
                this.y = -noteHeight;
                this.color = COLORS[lane % COLORS.length];
                this.active = true;
            }
            update(dt) {
                this.y += noteSpeed * (dt / 1000);
            }
            draw(ctx) {
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 15;
                ctx.shadowColor = this.color;
                const margin = 8;
                ctx.beginPath();
                ctx.roundRect(this.x + margin, this.y, laneWidth - (margin * 2), noteHeight, 4);
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 150 + 50;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.life = 1.0;
                this.size = Math.random() * 3 + 2;
            }
            update(dt) {
                this.x += this.vx * (dt / 1000);
                this.y += this.vy * (dt / 1000);
                this.life -= (dt / 1000) * 2;
            }
            draw(ctx) {
                ctx.globalAlpha = Math.max(0, this.life);
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1.0;
            }
        }

        class FloatingText {
            constructor(text, x, y, color) {
                this.text = text;
                this.x = x;
                this.y = y;
                this.color = color;
                this.life = 1.0;
                this.vy = -40;
            }
            update(dt) {
                this.y += this.vy * (dt / 1000);
                this.life -= (dt / 1000) * 1.5;
            }
            draw(ctx) {
                ctx.globalAlpha = Math.max(0, this.life);
                ctx.font = "bold 24px 'Orbitron'";
                ctx.fillStyle = this.color;
                ctx.textAlign = "center";
                ctx.shadowBlur = 12;
                ctx.shadowColor = this.color;
                ctx.fillText(this.text, this.x, this.y);
                ctx.shadowBlur = 0;
                ctx.globalAlpha = 1.0;
            }
        }

        function handleInput(laneIndex) {
            if (!isPlaying) return;
            const laneNotes = notes.filter(n => n.lane === laneIndex && n.active);
            
            if (laneNotes.length > 0) {
                const targetNote = laneNotes.reduce((prev, curr) => (prev.y > curr.y) ? prev : curr);
                const distance = Math.abs(targetNote.y + (noteHeight / 2) - hitZoneY);
                const hitCenter = targetNote.x + (laneWidth / 2);
                
                if (distance < 40) {
                    registerHit(targetNote, 100, "PERFECT!", COLORS[laneIndex]);
                } else if (distance < 80) {
                    registerHit(targetNote, 50, "GOOD", "#fff");
                } else if (distance < 120) {
                    combo = 0;
                    targetNote.active = false;
                    floatingTexts.push(new FloatingText("MISS", hitCenter, hitZoneY, "red"));
                    updateUI();
                }
            }
        }

        function registerHit(note, points, text, color) {
            note.active = false;
            score += points + (combo * 5);
            combo++;
            const centerX = note.x + (laneWidth / 2);
            
            for (let i = 0; i < 12; i++) {
                particles.push(new Particle(centerX, hitZoneY, color));
            }
            floatingTexts.push(new FloatingText(text, centerX, hitZoneY - 20, color));
            updateUI();
        }

        function updateUI() {
            scoreEl.innerText = score;
            comboEl.innerText = combo;
        }

        let lastTime = 0;
        function gameLoop(timestamp) {
            if (!isPlaying) return;

            const dt = timestamp - lastTime;
            lastTime = timestamp;

            spawnTimer += dt;
            if (spawnTimer >= spawnInterval) {
                const lane = Math.floor(Math.random() * numLanes);
                notes.push(new Note(lane));
                spawnTimer = 0;
            }

            notes.forEach(note => note.update(dt));
            particles.forEach(p => p.update(dt));
            floatingTexts.forEach(ft => ft.update(dt));

            notes = notes.filter(note => {
                if (note.y > canvas.height) {
                    if (note.active) {
                        combo = 0;
                        updateUI();
                        floatingTexts.push(new FloatingText("MISS", note.x + (laneWidth / 2), hitZoneY + 20, "red"));
                    }
                    return false;
                }
                return note.active;
            });
            particles = particles.filter(p => p.life > 0);
            floatingTexts = floatingTexts.filter(ft => ft.life > 0);

            ctx.fillStyle = 'rgba(10, 10, 15, 0.4)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.04)';
            ctx.lineWidth = 1;
            for (let i = 1; i < numLanes; i++) {
                ctx.beginPath();
                ctx.moveTo(i * laneWidth, 0);
                ctx.lineTo(i * laneWidth, canvas.height);
                ctx.stroke();
            }

            ctx.beginPath();
            ctx.moveTo(0, hitZoneY);
            ctx.lineTo(canvas.width, hitZoneY);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.lineWidth = 2;
            ctx.shadowBlur = 8;
            ctx.shadowColor = '#fff';
            ctx.stroke();
            ctx.shadowBlur = 0;

            notes.forEach(note => note.draw(ctx));
            particles.forEach(p => p.draw(ctx));
            floatingTexts.forEach(ft => ft.draw(ctx));

            requestAnimationFrame(gameLoop);
        }

        startBtn.addEventListener('click', () => {
            if (!currentSongUrl) return;

            startBtn.disabled = true;
            startBtn.innerText = "Caricamento...";

            // Sblocco audio nativo per iPhone
            audioElement.src = currentSongUrl;
            audioElement.load();
            
            audioElement.play().then(() => {
                startScreen.classList.add('hidden');
                score = 0; combo = 0; notes = []; particles = []; floatingTexts = [];
                updateUI();

                isPlaying = true;
                spawnTimer = 0;
                lastTime = performance.now();
                requestAnimationFrame(gameLoop);

                audioElement.onended = endGame;
            }).catch(err => {
                console.error(err);
                alert("Impossibile riprodurre l'audio. Controlla il nome del file nella cartella audio su GitHub.");
                startBtn.disabled = false;
                startBtn.innerText = "Inizia Show";
            });
        });

        function endGame() {
            isPlaying = false;
            audioElement.pause();
            startScreen.querySelector('h1').innerText = "LIVE FINITO";
            startScreen.querySelector('.subtitle').innerText = `Score Finale: ${score}`;
            startBtn.innerText = "Gioca di nuovo";
            startBtn.disabled = false;
            startScreen.classList.remove('hidden');
        }

        document.querySelectorAll('.diff-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentDiff = btn.dataset.diff;
                updateDifficultySettings();
            });
        });

        window.addEventListener('keydown', (e) => {
            if (!isPlaying || e.repeat) return;
            const keyIndex = ACTIVE_KEYS.indexOf(e.key.toLowerCase());
            if (keyIndex !== -1 && keyIndex < numLanes) {
                handleInput(keyIndex);
            }
        });

        buildSongList();
        updateDifficultySettings();
    </script>
</body>
</html>
